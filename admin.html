<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wafenix CyberShield — Admin</title><style>
:root{--bg:#0a0e1a;--surface:#10162a;--surface2:#161d35;--line:#232b47;--text:#e8ecf4;--muted:#8b93a7;--green:#35c97d;--red:#e8556b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}a{color:var(--green)}.wrap{max-width:1200px;margin:auto;padding:30px 20px}h1,h2{font-family:monospace}.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;margin-bottom:20px}input,select{background:var(--bg);color:var(--text);border:1px solid var(--line);padding:11px;border-radius:4px;width:100%}button{background:var(--green);border:0;padding:10px 16px;border-radius:4px;font-weight:bold;cursor:pointer}.hidden{display:none}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-size:12px}.error{color:var(--red);margin-top:10px}.muted{color:var(--muted)}
</style></head><body><div class="wrap"><div class="top"><div><h1>WAFENIX / ADMIN</h1><div class="muted">Leads & booking requests</div></div><button id="logout" class="hidden">Logout</button></div><div id="login" class="card"><h2>Admin login</h2><input id="password" type="password" placeholder="Admin password"><br><br><button id="loginBtn">Login</button><div id="loginMsg" class="error"></div></div><div id="app" class="hidden"><div class="card"><h2>Enquiries</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Created</th><th>Contact</th><th>Company</th><th>Message</th><th>Status</th></tr></thead><tbody id="leads"></tbody></table></div></div><div class="card"><h2>Bookings</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Date / time</th><th>Contact</th><th>Company</th><th>Message</th><th>Status</th></tr></thead><tbody id="bookings"></tbody></table></div></div></div></div><script>
const statuses={leads:['new','contacted','qualified','closed','spam'],bookings:['requested','confirmed','completed','cancelled','no-show']};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function check(){try{await api('/api/admin/me');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('logout').classList.remove('hidden');load()}catch{}}
async function load(){const [l,b]=await Promise.all([api('/api/admin/leads'),api('/api/admin/bookings')]);document.getElementById('leads').innerHTML=l.leads.map(x=>`<tr><td>${x.id}</td><td>${esc(x.created_at)}</td><td>${esc(x.name)}<br>${esc(x.email)}</td><td>${esc(x.company)}</td><td>${esc(x.message)}</td><td>${select('leads',x.id,x.status)}</td></tr>`).join('');document.getElementById('bookings').innerHTML=b.bookings.map(x=>`<tr><td>${x.id}</td><td><b>${esc(x.booking_date)}</b><br>${esc(x.booking_time)}</td><td>${esc(x.name)}<br>${esc(x.email)}<br>${esc(x.phone)}</td><td>${esc(x.company)}</td><td>${esc(x.message)}</td><td>${select('bookings',x.id,x.status)}</td></tr>`).join('');document.querySelectorAll('select[data-kind]').forEach(s=>s.onchange=async()=>{await api(`/api/admin/${s.dataset.kind}/${s.dataset.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value})})})}
function select(kind,id,current){return `<select data-kind="${kind}" data-id="${id}">${statuses[kind].map(s=>`<option ${s===current?'selected':''}>${s}</option>`).join('')}</select>`}
document.getElementById('loginBtn').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});document.getElementById('loginMsg').textContent='';check()}catch(e){document.getElementById('loginMsg').textContent=e.message}};document.getElementById('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};check();
</script></body></html>
