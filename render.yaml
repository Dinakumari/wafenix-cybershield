services:
  - type: web
    name: wafenix-cybershield
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DB_PATH
        value: /app/data/wafenix.db
      - key: WHATSAPP_NUMBER
        value: 918700323463
    disk:
      name: wafenix-data
      mountPath: /app/data
      sizeGB: 1
